# /etc/nginx/sites-available/gradeassist
# HTTP-only to start. Run `certbot --nginx -d ispum.ru -d www.ispum.ru`
# afterwards — it auto-adds the HTTPS (443) server block, the certificate
# paths, and the HTTP→HTTPS redirect. Because certbot edits the LIVE file
# directly and that edit never flows back into git, this repo copy only ever
# shows the 80 block — the upstream block below has to be applied to BOTH
# server blocks on the actual VM, not just this file. See the deploy.sh
# header for the one-time manual-nginx-change precedent this follows.

# Two backend replicas as of docs/on-prem-deployment.md §16 Track 1.4b
# (second replica) — host-networked containers on :3000 and :3001 (see
# deploy/docker-compose.cloud.yml). least_conn over the default round-robin:
# AI-grading requests vary wildly in duration (a quick quiz-question call vs.
# a multi-minute ВКР map-reduce pass), so routing to whichever replica has
# fewer requests in flight balances load better than blindly alternating.
upstream ispum_api {
    least_conn;
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name ispum.ru www.ispum.ru;

    # Security headers (supplement helmet on the API)
    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    # CSP for the served SPA — helmet's CSP (app.ts) only covers API JSON
    # responses, not this static bundle. Sources needed: Google Fonts
    # (stylesheet + font files), Yandex Metrika (external loader script at
    # /metrika-init.js + beacon/pixel), VK video embeds (help-centre iframes),
    # and 'self' for the app's own JS/CSS/API calls. script-src has no
    # 'unsafe-inline' — the Metrika loader was moved out of index.html into
    # frontend/public/metrika-init.js specifically so this could be dropped;
    # don't reintroduce an inline <script> in index.html without adding it back.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://mc.yandex.ru; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://mc.yandex.ru; frame-src https://vk.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── API → Node backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://ispum_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;   # AI calls can be slow
        proxy_connect_timeout 10s;
        client_max_body_size  21M;    # match multer 20 MB limit
    }

    # ── Frontend → Yandex Object Storage static website ─────────────────
    location / {
        proxy_pass https://gradeassist-frontend.website.yandexcloud.net;
        proxy_set_header Host gradeassist-frontend.website.yandexcloud.net;
        proxy_ssl_server_name on;                 # SNI for the TLS hop to the bucket
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;           # SPA deep-link fallback
    }
    location @spa_fallback {
        # Named locations can't have a URI in proxy_pass — rewrite to /index.html first.
        rewrite ^ /index.html break;
        proxy_pass https://gradeassist-frontend.website.yandexcloud.net;
        proxy_set_header Host gradeassist-frontend.website.yandexcloud.net;
        proxy_ssl_server_name on;
    }
}
