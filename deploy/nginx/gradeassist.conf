# /etc/nginx/sites-available/gradeassist
# HTTP-only to start. Run `certbot --nginx -d ispum.ru -d www.ispum.ru`
# afterwards — it auto-adds the HTTPS (443) server block, the certificate
# paths, and the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name ispum.ru www.ispum.ru;

    # Security headers (supplement helmet on the API)
    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    # CSP for the served SPA — helmet's CSP (app.ts) only covers API JSON
    # responses, not this static bundle. Sources needed: Google Fonts
    # (stylesheet + font files), Yandex Metrika (inline loader script in
    # index.html + beacon/pixel), VK video embeds (help-centre iframes),
    # and 'self' for the app's own JS/CSS/API calls.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://mc.yandex.ru; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://mc.yandex.ru; frame-src https://vk.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── API → Node backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;   # AI calls can be slow
        proxy_connect_timeout 10s;
        client_max_body_size  21M;    # match multer 20 MB limit
    }

    # ── Frontend → Yandex Object Storage static website ─────────────────
    location / {
        proxy_pass https://gradeassist-frontend.website.yandexcloud.net;
        proxy_set_header Host gradeassist-frontend.website.yandexcloud.net;
        proxy_ssl_server_name on;                 # SNI for the TLS hop to the bucket
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;           # SPA deep-link fallback
    }
    location @spa_fallback {
        # Named locations can't have a URI in proxy_pass — rewrite to /index.html first.
        rewrite ^ /index.html break;
        proxy_pass https://gradeassist-frontend.website.yandexcloud.net;
        proxy_set_header Host gradeassist-frontend.website.yandexcloud.net;
        proxy_ssl_server_name on;
    }
}
