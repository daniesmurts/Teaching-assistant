# /etc/nginx/sites-available/gradeassist
# Symlink into sites-enabled, then: nginx -t && systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ispum.ru www.ispum.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ispum.ru www.ispum.ru;

    # SSL — from Yandex Certificate Manager (download cert + key to these paths)
    ssl_certificate     /etc/ssl/gradeassist/certificate.pem;
    ssl_certificate_key /etc/ssl/gradeassist/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── API → Node backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;   # AI calls can be slow
        proxy_connect_timeout 10s;
        client_max_body_size  21M;    # match multer 20 MB limit
    }

    # ── Frontend — served from Yandex Object Storage ────────────────────
    # OPTION A (recommended): point a Yandex CDN at the frontend bucket and
    # let the CDN serve gradeassist.ru directly. Then this server block only
    # needs the /api/ location and you can drop everything below.
    #
    # OPTION B: proxy the static bucket through this VM (simpler, no CDN):
    location / {
        proxy_pass https://gradeassist-frontend.website.yandexcloud.net;
        proxy_set_header Host gradeassist-frontend.website.yandexcloud.net;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }
    location @spa_fallback {
        proxy_pass https://gradeassist-frontend.website.yandexcloud.net/index.html;
        proxy_set_header Host gradeassist-frontend.website.yandexcloud.net;
    }
}
