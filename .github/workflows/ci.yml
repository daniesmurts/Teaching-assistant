name: CI

# docs/on-prem-deployment.md §15.1 / §16 Track 1.1 — the repository's first
# pipeline. Everything downstream in that plan (immutable artifacts, version
# honesty, release branches, the upgrade test, image scanning, SBOM) assumes a
# build server exists; this is it.
#
# Deliberately NOT here yet, each a follow-up slice:
#   • bundle smoke test   — needs the Compose bundle (Track 3.7)
#   • upgrade test        — needs a seeded DB snapshot at the oldest supported
#                           version (Track 3.7)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The newest push to a ref is the only one whose result matters — cancel
# superseded runs rather than paying for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 20 matches the production VM (vm-setup.sh installs nodesource
      # 20.x). Do NOT bump this to track whatever is newest on a dev laptop —
      # CI exists to catch what breaks in production, and a version skew
      # between the two is exactly the class of bug it should be finding.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Root install covers both workspaces via the root package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (backend)
        run: npm run typecheck --workspace=backend

      - name: Unit tests (backend)
        run: npm run test --workspace=backend

      - name: Unit tests (frontend)
        run: npm run test --workspace=frontend

      # `npm run build --workspace=frontend` is `tsc && vite build`, so this
      # covers the frontend typecheck AND catches Vite/PWA build failures that
      # tsc alone would not. The frontend build runs on every deploy, so a
      # broken one must fail here rather than at deploy time.
      - name: Typecheck + build (frontend)
        run: npm run build --workspace=frontend

  integration:
    name: Integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # PG 15 to match the production VM (vm-setup.sh pins PostgreSQL 15 from
      # the PGDG repo, since Ubuntu 24.04's default repos have no
      # postgresql-15-pgvector). Same reasoning as the Node 20 pin above: a
      # version skew between CI and prod is a bug source, not a convenience.
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .env.test is gitignored (it holds real local keys), so CI synthesises a
      # disposable one — random JWT secret, freshly generated SAML/LTI
      # keypairs, fake T-Bank credentials. See backend/scripts/generateTestEnv.ts.
      - name: Generate .env.test
        run: npm run test:env --workspace=backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ispum_test

      # Creates the database, enables pgvector, then applies every migration
      # with the same runner production uses — so a migration that only works
      # against an already-populated schema fails here, not on a customer's box.
      - name: Create + migrate test database
        run: npm run test:integration:setup --workspace=backend

      - name: Integration tests
        run: npm run test:integration --workspace=backend

  image:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never publish an artifact that hasn't passed both suites — the whole
    # point of an immutable image is that its tag is a promise about what's in it.
    needs: [test, integration]

    steps:
      - uses: actions/checkout@v4

      # Same string deploy.sh writes ("1.5.0 (2026-08-15+abc1234)"), so a
      # container reports the same version as a VM deploy of the same commit.
      # The IMAGE TAG uses a hyphenated form because Docker tags allow neither
      # spaces nor parentheses.
      - name: Compute version
        id: version
        run: |
          SEMVER="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          echo "build_version=${SEMVER} (${DATE}+${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SEMVER}-${SHORT_SHA}"               >> "$GITHUB_OUTPUT"

      # Publishing is opt-in: without a registry secret the image is still
      # BUILT on every run (which is what catches a broken Dockerfile), just
      # not pushed. Set YC_REGISTRY_ID + YC_SA_JSON_KEY to turn publishing on
      # — no workflow edit needed. Yandex Container Registry rather than
      # ghcr.io/Docker Hub: production is in Yandex Cloud, and customers behind
      # a RU perimeter can't be assumed to reach foreign registries
      # (docs/on-prem-deployment.md §9).
      - name: Registry configured?
        id: registry
        run: |
          ENABLED="${{ secrets.YC_SA_JSON_KEY != '' && secrets.YC_REGISTRY_ID != '' }}"
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"
          # The repo name must stay VALID even with no secrets set — an empty
          # registry id would render as "cr.yandex//ispum-backend", which Docker
          # rejects and which would fail the build, not just the push.
          if [ "$ENABLED" = "true" ]; then
            echo "repo=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ispum-backend" >> "$GITHUB_OUTPUT"
          else
            echo "repo=ispum-backend" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build (and push when configured)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          # Push only from main — a PR build proves the image builds without
          # publishing an artifact for a commit that may never land.
          push: ${{ steps.registry.outputs.enabled == 'true' && github.event_name == 'push' }}
          # ALSO load into the runner's local Docker daemon regardless of
          # push — Trivy (below) scans a local image reference, and this way
          # scanning runs on every build, PRs included, not just pushes to
          # main. Distinct from the `sbom: false` two lines down: that flag
          # disables buildx's OWN embedded-in-the-manifest SBOM attestation
          # (the multi-manifest structure that broke the Yandex Container
          # Registry push, see the comment below) — it has nothing to do
          # with the standalone SBOM file Trivy generates as a separate step.
          load: true
          # buildx attaches a provenance/SBOM attestation manifest by default
          # since v0.11 — a multi-manifest OCI structure Docker Hub/GHCR
          # understand but Yandex Container Registry rejects outright
          # ("Cannot read manifest data") even though every layer pushed
          # fine. Not a build problem; a registry-compatibility one. Disable
          # both explicitly rather than relying on the (registry-dependent)
          # default.
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.build_version }}
          tags: |
            ${{ steps.registry.outputs.repo }}:${{ steps.version.outputs.image_tag }}
            ${{ steps.registry.outputs.repo }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Vulnerability scan + SBOM (docs/on-prem-deployment.md §15.5, §16
      # Track 1.5) — procurement artifacts state-university ИБ increasingly
      # requires before they'll even open the questionnaire. Scans the image
      # that was just built (loaded locally above), not a registry pull, so
      # this runs on every push AND every PR.
      #
      # Non-blocking by design, for now: `exit-code: 0` means a CRITICAL/HIGH
      # finding is reported, not a failed build. Day one of scanning is not
      # the day to hard-fail CI on whatever the base image and npm tree
      # already carry — that would block every deploy on a backlog that
      # doesn't exist yet. Tightening this to fail on CRITICAL once a real
      # baseline exists is a natural follow-up (one flag flip), tracked
      # rather than silently deferred — see TODO.md.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.registry.outputs.repo }}:${{ steps.version.outputs.image_tag }}
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Vulnerability scan summary
        run: |
          echo "### Vulnerability scan (Trivy, CRITICAL+HIGH)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(scan did not produce output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # SBOM — CycloneDX, the more common format procurement/customer
      # security teams ask for; SPDX is a one-line format change if a
      # specific customer needs that instead.
      - name: Generate SBOM (Trivy, CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.registry.outputs.repo }}:${{ steps.version.outputs.image_tag }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload scan + SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ steps.version.outputs.image_tag }}
          path: |
            trivy-results.txt
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        run: |
          echo "### Backend image" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${{ steps.version.outputs.build_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.version.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.registry.outputs.enabled }}" != "true" ]; then
            echo "- **not pushed** — set \`YC_REGISTRY_ID\` and \`YC_SA_JSON_KEY\` repository secrets to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
